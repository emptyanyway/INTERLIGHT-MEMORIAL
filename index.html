<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Память</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Inter&display=swap" rel="stylesheet">
<style>
body { margin:0; padding:30px; background:#0b0b0b; color:#eee; font-family:'Inter',sans-serif; animation:fadeIn 1s ease; }
@keyframes fadeIn {from{opacity:0}to{opacity:1}}
h1 { text-align:center; font-family:'Cormorant Garamond',serif; font-size:40px; margin-bottom:40px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; }
.card { background:#141414; border-radius:12px; overflow:hidden; cursor:pointer; transform:translateY(20px); opacity:0; transition:.4s; }
.card.show { transform:translateY(0); opacity:1; }
.card:hover { transform:translateY(-8px) scale(1.01); }
.card img { width:100%; height:260px; object-fit:cover; filter:grayscale(40%); transition:.5s; }
.card:hover img { filter:grayscale(0%); }
.card h2 { margin:10px; font-family:'Cormorant Garamond',serif; }
.card p { margin:0 10px 10px; color:#aaa; }
.profile { max-width:600px; margin:40px auto; text-align:center; animation:fadeUp .8s ease; }
@keyframes fadeUp { from {opacity:0;transform:translateY(20px)} to {opacity:1;transform:translateY(0)} }
.profile img { width:100%; border-radius:12px; margin-bottom:20px; }
a { color:#aaa; text-decoration:none; }
a:hover { color:#fff; }
</style>
</head>
<body>

<h1>Память</h1>
<div id="app"></div>

<script>
const people = [
 { name: "Янузаева Лилия Альваровна", dates: "03.02.2003 — 13.04.2024", image: "https://via.placeholder.com/400x500?text=Фото+нет", desc: "Лилия родилась 3 февраля 2003 года в Волгограде. Последние годы занималась бизнесом, завязанным на сдаче готовых квартир в аренду. Трагически ушла из жизни 13 апреля 2024 года, разбившись на машине в центре Москвы" },
 { name: "Ляйзова Вероника Тимофеевна", dates: "09.04.2002 — 16.01.2025", image: "https://i.ibb.co/p64cmvK7/IMG-1181.jpg", desc: "Вероника Ляйзова — гражданка Италии. Любила путешествовать и училась в авиауниверситете на стюардессу. 16 января утонула в ледяной воде местного озера Альбано." },
 { name: "Одинцов Дамир Валерьевич", dates: "15.04.2000 — 16.03.2025", image: "https://i.ibb.co/DfR0MhtS/IMG-1182.jpg", desc: "Дамир Одинцов родом из Москвы. Половину своей жизни отдал спорту. Во время срочной службы подписал контракт, по окончании которого его призвали на фронт, где он и погиб." },
 { name: "Фенцов Кирилл Дмитриевич", dates: "12.08.2001 — 08.07.2025", image: "https://via.placeholder.com/400x500?text=Фото+нет", desc: "Кирилл Фенцов — парень из Москвы, который после расставания с девушкой призвался на срочную службу, где совершил акт самоубийства. Причины все еще неизвестны"},
 { name: "Куваева Милада Владимировна", dates: "20.06.2005 — 19.07.2025", image: "https://i.ibb.co/Dg70Sz01/IMG-1183.jpg", desc: "Милада родилась в Москве, но в раннем возрасте семья переехала в Дублин, Ирландия. После гибели родителей установили диагноз экзогенной депрессии. Не выдержав угроз и шантажа, покончила с жизнью." },
 { name: "Шевчук Валерия Алексеевна", dates: "19.08.2005 — 27.10.2025", image: "https://i.ibb.co/7JrST55k/IMG-1184.jpg", desc: "Валерия Шевчук — уроженка Харькова, за год до начала боевых действий на Украине переехала в Киев. Осенью 2025 года во время очередного обстрела столицы получила осколочное ранение и скончалась." },
 { name: "Мизатова Диляра Камильевна", dates: "01.12.2006 — 01.12.2025", image: "https://i.ibb.co/wrFXdWCY/IMG-1185.jpg", desc: "Диляра Мизатова — крымская татарка. Весь 2025 год провела в путешествии с парнем по России. В конце ноября того же года посетили Узбекистан. Во время празднования дня рождения Диляры между ее молодым человеком и местными жителями произошел конфликт, в результате которого Диляра и парень оказались забиты до смерти." },
 { name: "Смолов Евгений Александрович", dates: "10.01.1998 — 21.12.2025", image: "https://via.placeholder.com/400x500?text=Фото+нет", desc: "Евгений родился в Курске. В 2020 году начал проходить срочную службу в лётных войсках, а в 2021 году после свадьбы подписал контракт. Самолёт под его управлением был сбит в небе над Кабулом" },
 { name: "Смолова Екатерина Николаевна", dates: "21.10.1999 — 21.12.2025", image: "https://i.ibb.co/1tQyQPqM/IMG-1186.jpg", desc: "Екатерина — проводница РЖД, жена Евгения Смолова. Узнав о гибели мужа, покончила жизнь самоубийством в тот же день." },
 { name: "Черникова (Фрамова)Екатерина Сергеевна", dates: "13.09.1999 — 11.02.2026", image: "https://i.ibb.co/DHBJVF94/IMG-1187.jpg", desc: "Екатерина родилась в Реутове Московской области. Некоторое время после получения диплома журналиста жила в Казахстане. Увидев объявление о новом выгодном для нее месте работы, поехала по адресу, воследствии была похищена и погибла в Лаосе в результате рабства." },
 { name: "Левандовская Элеонора Григорьевна", dates: "10.03.2005 — 19.02.2026", image: "https://i.ibb.co/gZhYsNzM/IMG-1189.jpg", desc: "Элеонора родилась в Волгограде, но после окончания школы поступила в Москву. На протяжении двух лет боролась с болезнью спины. В 2026 году отправилась на операцию в Израиль, которая ей не помогла." },
 { name: "Гаязова Софья Денисовна", dates: "01.03.2004 — 24.02.2026", image: "https://i.ibb.co/hJnLYy8c/IMG-1190.jpg", desc: "Софья родилась в Ухте, но большую часть жизни провела в Волгограде. После окончания академии МВД переехала на Кипр, где расписалась со своим молодым человеком. В феврале 2026 года на острове молодая пара совершила суицид без объяснения причин" },
 { name: "Кайлова Анна Сергеевна", dates: "14.06.2002 — 02.03.2026", image: "https://i.ibb.co/4gwQwSM7/IMG-1191.jpg", desc: "Анна Кайлова родилась в Химках, но вскоре переехала в Москву, где закончила РУДН и построила бизнес с годовым оборотом в 4 миллиона долларов. В последний год имела серьёзные проблемы с законом - сначала условный срок, затем побег из страны и уголовное дело после возвращения. Обнаружена мёртвой в камере ИВС ГУ МВД №2 города Санкт-Петербурга." }
];

const app = document.getElementById("app");

function showList() {
 app.innerHTML = '<div class="grid" id="grid"></div>';
 const grid = document.getElementById("grid");
 people.forEach((p,i)=>{
  const el=document.createElement("div");
  el.className="card";
  el.innerHTML=`<img src="${p.image || 'https://via.placeholder.com/400x500?text=Фото'}"><h2>${p.name}</h2><p>${p.dates}</p>`;
  el.onclick=()=>showProfile(i);
  grid.appendChild(el);
  setTimeout(()=>el.classList.add("show"), i*120);
 });
}

function showProfile(i){
 const p=people[i];
 app.innerHTML=`<div class="profile"><a href="#" onclick="showList()">← Назад</a><img src="${p.image || 'https://via.placeholder.com/400x500?text=Фото'}"><h1>${p.name}</h1><p>${p.dates}</p><p>${p.desc}</p></div>`;
}

showList();
</script>
</body>
</html>
